[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "structured-linear"
version = "0.2.0"
description = "Structured linear models for regression and binary classification"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Lucas Morin"}]
dependencies = ["array-api-compat>=1.12", "numpy>=1.24", "scipy>=1.8", "scikit-learn>=1.6"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/lcrmorin/structured-linear"
Documentation = "https://lcrmorin.github.io/structured-linear/"
Issues = "https://github.com/lcrmorin/structured-linear/issues"

[project.optional-dependencies]
docs = ["mkdocs-material==9.6.23", "mkdocstrings[python]==1.0.8"]
test = ["pytest>=8", "array-api-strict>=2.6", "cvxpy>=1.5", "pandas>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["sklearn_compat: scikit-learn generic estimator conformance checks"]
