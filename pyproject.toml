[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pliable-lasso"
version = "0.1.0"
description = "Pliable lasso regression and binary classification"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Lucas Morin"}]
dependencies = ["numpy>=1.24", "scipy>=1.8", "scikit-learn>=1.6"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/lcrmorin/pliable-lasso"
Documentation = "https://github.com/lcrmorin/pliable-lasso#readme"
Issues = "https://github.com/lcrmorin/pliable-lasso/issues"

[project.optional-dependencies]
test = ["pytest>=8", "cvxpy>=1.5", "pandas>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
