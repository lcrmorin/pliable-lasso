name: Publish release candidate to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: testpypi-distributions
          path: |
            dist/pliable_lasso-0.1.0rc1-*.whl
            dist/pliable_lasso-0.1.0rc1.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: testpypi-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  smoke-test:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy scikit-learn
      - name: Install the uploaded candidate
        run: |
          for attempt in 1 2 3 4 5; do
            if python -m pip install --no-deps --index-url https://test.pypi.org/simple/ 'pliable-lasso==0.1.0rc1'; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - run: python -c "from importlib.metadata import version; from pliable_lasso import PliableClassifier, PliableRegressor; assert version('pliable-lasso') == '0.1.0rc1'; X = [[0, 0], [1, 0], [0, 1], [1, 1]]; assert PliableRegressor(modifier_features=[1]).fit(X, [0, 1, 1, 3]).predict(X).shape == (4,); assert PliableClassifier(modifier_features=[1]).fit(X, [0, 0, 0, 1]).predict_proba(X).shape == (4, 2)"
