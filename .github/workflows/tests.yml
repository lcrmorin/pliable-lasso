name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      backend:
        description: Backend to test
        type: choice
        options: [cpu, mps, cuda]
        default: cpu
permissions:
  contents: read
jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.backend == 'cpu'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10', sklearn: 'scikit-learn==1.6.0'}
          - {os: ubuntu-latest, python: '3.13', sklearn: 'scikit-learn'}
          - {os: windows-latest, python: '3.12', sklearn: 'scikit-learn'}
          - {os: macos-latest, python: '3.12', sklearn: 'scikit-learn'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build twine "${{ matrix.sklearn }}"
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Test the installed wheel and source distribution
        shell: python {0}
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          SCIPY_ARRAY_API: '1'
        run: |
          from pathlib import Path
          from subprocess import run
          from sys import executable

          (wheel,) = Path("dist").glob("*.whl")
          (source,) = Path("dist").glob("*.tar.gz")
          run([executable, "-m", "pip", "install", f"{wheel}[test]",
               "${{ matrix.sklearn }}"], check=True)
          run([executable, "-m", "pytest"], check=True)
          run([executable, "-m", "pip", "install", "--force-reinstall", "--no-deps",
               str(source)], check=True)
          run([executable, "-m", "pytest"], check=True)

  mps:
    if: github.event_name == 'workflow_dispatch' && inputs.backend == 'mps'
    runs-on: [self-hosted, macOS, ARM64, structured-linear-mps]
    timeout-minutes: 15
    env:
      PYTORCH_ENABLE_MPS_FALLBACK: '0'
      SCIPY_ARRAY_API: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . pytest torch
      - name: Require a usable Metal device
        run: |
          python -c "import torch; assert torch.backends.mps.is_available(), 'Runner does not expose a usable MPS device'; print(torch.ones(1, device='mps'))"
      - run: python -m pytest -v tests/test_pliable_torch.py tests/test_structured_torch.py -k mps
      - name: Run scikit-learn MPS conformance checks
        env:
          PYTORCH_ENABLE_MPS_FALLBACK: '1'
        run: python -m pytest -v tests/test_array_api_kernel.py -k "upstream_array_api and mps"

  cuda:
    if: github.event_name == 'workflow_dispatch' && inputs.backend == 'cuda'
    runs-on: [self-hosted, linux, structured-linear-cuda]
    timeout-minutes: 20
    env:
      SCIPY_ARRAY_API: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m pip install . pytest
      - name: Require a CUDA-enabled PyTorch installation
        run: |
          python -c "import torch; assert torch.cuda.is_available(), 'Runner does not expose CUDA to PyTorch'; print(torch.cuda.get_device_name())"
      - run: python -m pytest -v tests/test_pliable_torch.py tests/test_structured_torch.py tests/test_array_api_kernel.py -k cuda
      - name: Benchmark both dtypes
        run: |
          python benchmarks/benchmark_pliable_cuda.py --dtype float32
          python benchmarks/benchmark_pliable_cuda.py --dtype float64
