site_name: Structured Linear
site_description: Interpretable regression and classification with structured coefficients
site_url: https://lcrmorin.github.io/structured-linear/
repo_url: https://github.com/lcrmorin/structured-linear
theme:
  name: material
  palette:
    primary: teal
    accent: teal
  features:
    - content.code.copy
nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Estimators:
      - Comparison and preprocessing: estimators.md
      - Pliable lasso: pliable.md
      - Fused scorecards: fused.md
      - Data-shared lasso: data-shared.md
  - Worked examples:
      - Conditional slopes and paths: real-data-example.md
      - Data-shared lasso on German Credit: data-shared-example.md
  - Benchmark: benchmark.md
strict: true
markdown_extensions:
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js
